name: images
# Build docker/<tool>/<version>/Dockerfile for linux/amd64 (agate) and push to
# ghcr.io/canid-genomics/<tool>:<version> and :<version>-<sha7>. Prints the digest for
# config/images.yaml and IMAGES.md. Image changes go through a PR reviewed by the other person.
on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'docker/<tool>/'
        required: true
      version:
        description: 'docker/<tool>/<version>/'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ inputs.tool }}/${{ inputs.version }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/canid-genomics/${{ inputs.tool }}:${{ inputs.version }}
            ghcr.io/canid-genomics/${{ inputs.tool }}:${{ inputs.version }}-${{ steps.meta.outputs.sha7 }}
      - name: version check and digest
        run: |
          IMG=ghcr.io/canid-genomics/${{ inputs.tool }}@${{ steps.build.outputs.digest }}
          docker run --rm --platform linux/amd64 --entrypoint "${{ inputs.tool }}" "$IMG" --version || true
          echo "### ${{ inputs.tool }} ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "config/images.yaml: '$IMG'" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMG"
